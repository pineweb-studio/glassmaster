<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A1A2F">
<title>Agenda · GlassMaster</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="stylesheet" href="admin.css">
</head>
<body class="pg-agenda">
<main class="miolo">
  <div class="cabeca">
    <div><p class="olho" id="hoje-txt"></p><h1 id="titulo">Agenda</h1></div>
    <button type="button" class="btn primario" id="novo">+ Agendar</button>
  </div>
  <a class="faixa" id="faixa" href="lembretes" hidden></a>
  <div class="alternar" role="tablist" id="vistas">
    <button type="button" role="tab" data-vista="lista" aria-selected="true" id="aba-lista"></button>
    <button type="button" role="tab" data-vista="mes" aria-selected="false" id="aba-mes"></button>
  </div>
  <section id="vista-lista" aria-live="polite"></section>
  <section id="vista-mes" hidden>
    <div class="mes-topo"><button type="button" class="btn mini" id="mes-ant" aria-label="&lt;">‹</button><h2 id="mes-nome"></h2><button type="button" class="btn mini" id="mes-prox" aria-label="&gt;">›</button></div>
    <div class="calendario" id="calendario"></div>
    <div id="dia-escolhido" aria-live="polite"></div>
  </section>
</main>
<script src="comum.js"></script>
<script src="agenda.js"></script>
</body>
</html>
