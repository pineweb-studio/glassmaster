# Worker que manda o e-mail de lembrete de limpeza para o Greg (grátis).
# Roda sozinho todo dia às 13:00 UTC (9h da manhã na Flórida no horário de verão, 8h no inverno).
name = "glassmaster-lembretes"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["0 13 * * *"]

# Mesmo banco do painel (glassmaster). O ID aparece em Cloudflare > Storage & Databases > D1 > glassmaster.
[[d1_databases]]
binding = "DB"
database_name = "glassmaster"
database_id = "COLE_AQUI_O_ID_DO_BANCO"

# Envio de e-mail pelo Cloudflare Email Routing (precisa do Email Routing ligado no domínio
# e do e-mail do Greg verificado em Email Routing > Destination addresses).
[[send_email]]
name = "EMAIL"
destination_address = "masterglass89@gmail.com"

[vars]
AVISO_PARA = "masterglass89@gmail.com"
AVISO_DE = "reminders@glassmastercleaning.com"
PAINEL = "https://glassmastercleaning.com/admin/lembretes"
